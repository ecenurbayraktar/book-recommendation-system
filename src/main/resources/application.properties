spring.application.name=book-recommendation
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/bookdb}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:bookuser}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:bookpass}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

recommender.api.url=${RECOMMENDER_API_URL:http://localhost:8000}
