<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>BookBloom</title>
    <link rel="stylesheet" href="style.css">
    <link rel="icon" type="image/png" href="logo.png">
</head>
<body>
<div class="topbar">
    <div class="logo">
    <img src="logo.png" alt="BloomBook">
    <span>BloomBook</span>
</div>
    <input id="search" placeholder="Kitap, yazar veya kategori ara..." onkeyup="searchBooks()">
</div>

<div class="container">

    <!-- FILTER -->
    <div class="filters">
        <h3>Filtrele</h3>
        <div id="categoryFilters"></div>
    </div>

    <!-- BOOKS -->
    <div class="left">
        <div id="bookList" class="grid"></div>
    </div>

    <!-- RIGHT -->
    <div class="right">
        <h2>✨ Senin İçin</h2>
        <div id="recommendList"></div>

        <h2>⭐ Favoriler</h2>
        <div id="favoriteList"></div>
    </div>

</div>


<script src="app.js"></script>
</body>
</html>
